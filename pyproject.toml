[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-describer"
version = "0.1.0"
description = "Uses multimodal AI to describe a given image"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Deacon Booker" }
]
dependencies = [
    "gradio",
    "Pillow",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
]